[project]
name = "AIPIM"
description = "Artificial Intelligence Project Instruction Manager"

# Dogfooding the 2.2 verification gate: complete_task is refused unless these
# passed after the task last changed. Run verify_task to record the evidence.
[checks]
commands = ["pnpm test", "pnpm lint", "pnpm type-check"]

# Dogfooding the 2.4 consensus gate: a changeset is not applied while a critical
# assumption is open, and every proposed task carries an estimate.
[discovery]
max_open_critical = 0
max_tasks_per_changeset = 15
require_estimates = true
require_grounding = true

