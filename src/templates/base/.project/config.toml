[project]
name = "My Project"
description = "Project description"

# Commands that must pass before a task can be completed.
# With this set, complete_task is rejected unless verify_task recorded a passing
# run for every command *after* the task last changed. Leave it out to disable
# the gate entirely.
# [checks]
# commands = ["pnpm test", "pnpm lint"]

# Claude Code hook behaviour (see `aipim hook install`).
# block_on_unverified stops the agent from ending its turn while an in-progress
# task still has failing or missing checks. Off by default.
# [hooks]
# block_on_unverified = true

# Consensus gate for discovery changesets. Every field is off unless set, so
# leaving this out disables the gate entirely.
#   max_open_critical       — refuse to apply while critical assumptions are open
#   max_tasks_per_changeset — cap against a session inventing a whole fake backlog
#   require_estimates       — every proposed task carries estimatedHours
#   require_grounding       — a non-empty project must record what the idea touches
# [discovery]
# max_open_critical = 0
# max_tasks_per_changeset = 15
# require_estimates = true
# require_grounding = true

# Add team members below (optional — works as solo dev without this)
# [[team]]
# id = "alice"
# name = "Alice Smith"
# email = "alice@example.com"
# role = "tech-lead"
# areas = ["backend", "architecture"]
